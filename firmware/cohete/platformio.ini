[platformio]
default_envs = demeter

; Misma computadora de vuelo en los dos cohetes: solo cambian el identificador y el puerto.
[flight_base]
platform = espressif32@6.13.0
framework = arduino
board = t-beams3-supreme
upload_speed = 921600
monitor_speed = 115200
monitor_dtr = 0 ; sin esto, abrir o cerrar el monitor reinicia la placa (DTR/RTS del USB del S3 controlan el reset)
monitor_rts = 0
monitor_filters =
    time
    default
    esp32_exception_decoder
board_build.partitions = huge_app.csv
lib_extra_dirs =
    ../vendor/Lilygo-LoRa-Series/lib
    ../common
build_flags =

    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DT_BEAM_S3_SUPREME_SX1262 ; Define para usar T-BEAM S3 Supreme con el modulo de radio SX1262
   
    ;--------------------PRUEBAS DE HARDWARE Y FUNCIONALIDAD
    ;-DTBEAM_FW_OWN_GNSS
    ;-DTEST_GNSS_PPS
    ;-DTEST_SD_IMU
    ;-DTEST_LORA_TX
    ;--------------------

    -DTEST_CORE
    -DMISSION_ID=0 ; numero de mision o vuelo: va en el nombre de los logs
    ;-DNET_TX_DBM=22 ; descomentar para pruebas de alcance y vuelo, habilita transmision a maxima potencia (por defecto 10 dBm, banco)

; Ajustar el puerto al que le asigne Windows al conectar Demeter.
[env:demeter]
extends = flight_base
upload_port = COM4
monitor_port = COM4
build_flags =
    ${flight_base.build_flags}
    -DROCKET_ID=1

; Ajustar el puerto al que le asigne Windows al conectar Hermes.
[env:hermes]
extends = flight_base
upload_port = COM3
monitor_port = COM3
build_flags =
    ${flight_base.build_flags}
    -DROCKET_ID=2

; Campo: alcance y vuelo, a maxima potencia.
[env:demeter_campo]
extends = env:demeter
build_flags =
    ${env:demeter.build_flags}
    -DNET_TX_DBM=22

[env:hermes_campo]
extends = env:hermes
build_flags =
    ${env:hermes.build_flags}
    -DNET_TX_DBM=22

; Prueba: Hermes arranca sin anclar la hora al GNSS, solo con la baliza de tierra. No es para vuelo.
[env:hermes_sinhora]
extends = env:hermes
build_flags =
    ${env:hermes.build_flags}
    -DGNSS_NO_ANCHORS
