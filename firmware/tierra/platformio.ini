[platformio]
default_envs = tierra

[env:tierra]
platform = espressif32@6.13.0
framework = arduino
board = esp32dev
upload_speed = 921600
monitor_speed = 115200
monitor_echo = yes
monitor_filters =
    time
    default
    esp32_exception_decoder
board_build.partitions = huge_app.csv
lib_extra_dirs =
    ../vendor/Lilygo-LoRa-Series/lib
    ../common
upload_port = COM5
monitor_port = COM5
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -mfix-esp32-psram-cache-issue
    -DBOARD_HAS_PSRAM
    -DT_BEAM_SX1262
    -DCORE_DEBUG_LEVEL=0
    -DTBEAM_FW_OWN_GNSS
    ;-DGND_TX_DBM=22 ; descomentar para alcance y vuelo (por defecto 10 dBm, banco)

; Campo: alcance y vuelo, a maxima potencia.
[env:tierra_campo]
extends = env:tierra
build_flags =
    ${env:tierra.build_flags}
    -DGND_TX_DBM=22
