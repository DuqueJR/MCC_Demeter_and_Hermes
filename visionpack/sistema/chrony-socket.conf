# demeter-telemetry corre como admin: tiene que poder escribir en el socket que crea chronyd (como root).
# La unidad de Debian corre como _chrony: "+" ejecuta este paso con privilegios y "-" evita que un fallo apague chrony.
[Service]
ExecStartPost=-+/bin/sh -c 'for i in $$(seq 20); do [ -S /run/chrony.demeter.sock ] && exec chmod 0666 /run/chrony.demeter.sock; sleep 0.5; done; echo "no aparecio /run/chrony.demeter.sock"'
